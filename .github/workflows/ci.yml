name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Типы и линт
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Линт
        run: npm run lint

      - name: Форматирование
        run: npm run format

  tests:
    name: Герметичные тесты
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Unit- и API-тесты
        run: npm run test:hermetic

      - name: Метрики прогона в сводку
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Метрики прогона'
            echo '```'
            npm run metrics --silent || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
