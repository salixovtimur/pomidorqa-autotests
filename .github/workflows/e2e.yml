name: E2E

on:
  workflow_dispatch:
    inputs:
      repeat:
        description: Сколько раз прогнать каждый тест (проверка на флак)
        required: false
        default: "1"
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  e2e:
    name: E2E против стенда aiqa.su
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Установка Chromium
        run: npx playwright install --with-deps chromium

      - name: Прогон E2E
        run: npx playwright test --project=e2e --repeat-each=${{ inputs.repeat || 1 }}
        env:
          CI: true

      - name: Метрики прогона в сводку
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Метрики прогона E2E'
            echo '```'
            npm run metrics --silent || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Отчёт
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
