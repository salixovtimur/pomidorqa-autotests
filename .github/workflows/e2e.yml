name: E2E

# E2E отделены от основного пайплайна намеренно. Они идут на общий живой
# стенд aiqa.su: там одновременно работают другие люди, стенд бывает медленным
# и недоступным. Красная основная ветка из-за чужого сервера ничего не говорит
# о качестве кода, поэтому e2e гоняются по расписанию и по кнопке.
on:
  workflow_dispatch:
    inputs:
      repeat:
        description: Сколько раз прогнать каждый тест (проверка на флак)
        required: false
        default: "1"
  schedule:
    # Каждый день в 06:00 UTC — до начала рабочего дня, когда на стенде тихо.
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  e2e:
    name: E2E против стенда aiqa.su
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      # Ставим только Chromium: остальные движки в этом проекте не нужны,
      # а скачивание всех трёх удлиняет прогон втрое.
      - name: Установка Chromium
        run: npx playwright install --with-deps chromium

      - name: Прогон E2E
        run: npx playwright test --project=e2e --repeat-each=${{ inputs.repeat || 1 }}
        env:
          # Включает в playwright.config.ts один worker и повтор падения:
          # общий стенд не любит параллельную нагрузку.
          CI: true

      - name: Отчёт
        # Отчёт нужен именно когда упало, поэтому выгружаем при любом исходе,
        # кроме отменённого прогона.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
